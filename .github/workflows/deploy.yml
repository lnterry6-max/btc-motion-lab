name: Update historical report and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: btc-research-pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run report tests
        run: python -m unittest discover -s tests -v
      - name: Build actual market report
        run: python scripts/build_report.py --output site/data/report.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
